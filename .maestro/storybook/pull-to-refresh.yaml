appId: com.hyrkul.likan
name: Pull to refresh waits, deduplicates, and recovers after failure
tags: [storybook, refresh]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-navigation-shell--pull-to-refresh
      READY_ID: page-refresh-content
- assertVisible: 'Content revision: 1'
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 600
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Refresh requests: 1'
    timeout: 5000
- assertVisible: Refreshing
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 600
    waitToSettleTimeoutMs: 500
- assertVisible: 'Refresh requests: 1'
- assertVisible: 'Content revision: 1'
- tapOn:
    id: page-refresh-complete
- extendedWaitUntil:
    visible: 'Content revision: 2'
    timeout: 5000
- assertVisible: Ready
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 600
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Refresh requests: 2'
    timeout: 5000
- tapOn:
    id: page-refresh-fail
- extendedWaitUntil:
    visible: 'Refresh failed; saved content kept'
    timeout: 5000
- assertVisible: 'Content revision: 2'
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 600
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Refresh requests: 3'
    timeout: 5000
- tapOn:
    id: page-refresh-complete
- extendedWaitUntil:
    visible: 'Content revision: 3'
    timeout: 5000
- assertVisible: Ready
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-navigation-shell--pull-to-refresh-long-content
      READY_ID: page-refresh-content
- swipe:
    start: 50%, 25%
    end: 50%, 80%
    duration: 600
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Refresh requests: 1'
    timeout: 5000
- tapOn:
    id: page-refresh-complete
- extendedWaitUntil:
    visible: 'Content revision: 2'
    timeout: 5000
