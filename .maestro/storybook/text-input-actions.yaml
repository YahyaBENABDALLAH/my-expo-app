appId: com.hyrkul.likan
name: Text input focus blur and clear
tags: [smoke, storybook, input]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-text-input--imperative-actions
      READY_ID: expo-ui-text-input-focus
- tapOn:
    id: expo-ui-text-input-focus
- assertVisible:
    id: expo-ui-text-input
    focused: true
- hideKeyboard
- tapOn:
    id: expo-ui-text-input-blur
- assertVisible:
    id: expo-ui-text-input
    focused: false
- tapOn:
    id: expo-ui-text-input-clear
- assertNotVisible:
    id: expo-ui-text-input
    text: Hello native input
- tapOn:
    id: expo-ui-text-input
- inputText: Edited
- assertVisible:
    id: expo-ui-text-input
    text: Edited
- hideKeyboard
