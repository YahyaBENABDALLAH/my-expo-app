appId: com.hyrkul.likan
name: Live LTR RTL switch preserves drafts and updates an open native sheet
tags: [storybook, rtl]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-layout-direction--light
      READY_ID: layout-direction-status
- assertVisible: 'Direction: LTR'
- tapOn:
    id: layout-direction-draft
- inputText: 'Draft 123'
- hideKeyboard
- assertVisible: 'Draft: Draft 123'
- tapOn:
    id: layout-direction-switch
- assertVisible: 'Direction: RTL'
- assertVisible: 'Draft: Draft 123'
- scrollUntilVisible:
    element:
      id: layout-direction-open-sheet
    direction: DOWN
- tapOn:
    id: layout-direction-open-sheet
- assertVisible:
    id: layout-direction-sheet-title
- assertVisible: 'Sheet: RTL'
- tapOn:
    id: sheet-layout-direction-switch
- assertVisible: 'Sheet: LTR'
- assertVisible: 'Draft: Draft 123'
- tapOn:
    id: layout-direction-close-sheet
- assertNotVisible:
    id: layout-direction-sheet-title
- assertVisible: 'Direction: LTR'
- assertVisible: 'Draft: Draft 123'
- scrollUntilVisible:
    element:
      id: layout-direction-draft-right-icon
    direction: UP
- tapOn:
    id: layout-direction-draft-right-icon
- assertVisible: 'Draft: (empty)'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-layout-direction--rtl-dark
      READY_ID: layout-direction-status
- assertVisible: 'Direction: RTL'
- tapOn:
    id: layout-direction-switch
- assertVisible: 'Direction: LTR'
