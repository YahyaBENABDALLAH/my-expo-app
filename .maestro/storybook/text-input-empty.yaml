appId: com.hyrkul.likan
name: Empty text input accepts focus and editing without crashing
tags: [smoke, storybook, input]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-text-input--empty
      READY_ID: expo-ui-text-input
- tapOn:
    id: expo-ui-text-input
- inputText: Maestro
- assertVisible:
    id: expo-ui-text-input
    text: Maestro
- eraseText
- assertNotVisible:
    id: expo-ui-text-input
    text: Maestro
- assertVisible:
    id: expo-ui-text-input
- hideKeyboard
- assertVisible:
    id: storybook-screen
