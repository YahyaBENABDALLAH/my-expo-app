appId: com.hyrkul.likan
name: Diagonal button corners keep the full native press surface
tags: [storybook, smoke]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-button--top-left-bottom-right
      READY_ID: expo-ui-button
- assertVisible: 'Presses: 0'
- tapOn:
    id: expo-ui-button
    point: '50%, 10%'
- assertVisible: 'Presses: 1'
- tapOn:
    id: expo-ui-button
    point: '50%, 90%'
- assertVisible: 'Presses: 2'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-button--top-right-bottom-left
      READY_ID: expo-ui-button
- assertVisible: 'Presses: 0'
- tapOn:
    id: expo-ui-button
    point: '50%, 10%'
- assertVisible: 'Presses: 1'
- tapOn:
    id: expo-ui-button
    point: '50%, 90%'
- assertVisible: 'Presses: 2'
