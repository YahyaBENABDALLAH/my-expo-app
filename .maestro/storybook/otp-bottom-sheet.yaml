appId: com.hyrkul.likan
name: OTP entry, rejection, verification, resend and reset
tags: [smoke, storybook]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-otp-bottom-sheet--light
      READY_ID: otp-demo-open
- tapOn:
    id: otp-demo-open
- assertVisible:
    id: otp-sheet-title
- assertVisible:
    id: otp-sheet-input
# Opening and dismissing without typing exercises native sheet measurement each time.
- tapOn:
    id: otp-sheet-close
- assertNotVisible:
    id: otp-sheet-title
- tapOn:
    id: otp-demo-open
- assertVisible:
    id: otp-sheet-title
- assertVisible:
    id: otp-sheet-input
- tapOn:
    id: otp-sheet-input
- inputText: '000000'
- assertVisible:
    id: otp-sheet-verify
    enabled: true
- hideKeyboard
- tapOn:
    id: otp-sheet-verify
- assertVisible:
    id: otp-sheet-status
    text: "That code isn't correct.*"
- tapOn:
    id: otp-sheet-input
- eraseText: 6
- inputText: '123456'
- assertVisible:
    id: otp-sheet-verify
    enabled: true
- hideKeyboard
- tapOn:
    id: otp-sheet-verify
- assertVisible:
    id: otp-sheet-title
    text: "You're verified!"
- tapOn:
    id: otp-sheet-verify
- assertNotVisible:
    id: otp-sheet-title
- tapOn:
    id: otp-demo-open
- assertVisible:
    id: otp-sheet-status
    text: 'Preview code: 123456'
- tapOn:
    id: otp-sheet-input
- inputText: '123'
- tapOn:
    id: otp-sheet-verify
- assertVisible:
    id: otp-sheet-input
- hideKeyboard
- tapOn:
    id: otp-sheet-resend
- assertVisible:
    id: otp-sheet-status
    text: 'A new code is on its way.*'
- hideKeyboard
- tapOn:
    id: otp-sheet-close
- assertVisible:
    id: otp-demo-state
    text: 'Sheet: Closed · Resends: 1'
