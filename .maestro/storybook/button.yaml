appId: com.hyrkul.likan
name: Native buttons with direct color, padding and radius deliver and suppress presses
# Interaction uses direct colors, padding 12 and radius 12 for enabled; radius 0 for disabled.
# These assertions cover activation; corner geometry still needs visual inspection.
tags: [smoke, storybook]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-button--interaction
      READY_ID: button-count
- tapOn:
    id: button-count
- assertVisible: 'Presses: 1'
- tapOn:
    id: button-disabled
- assertVisible: 'Presses: 1'
- tapOn:
    id: button-count
- assertVisible: 'Presses: 2'
- tapOn:
    id: button-reset
- assertVisible: 'Presses: 0'
