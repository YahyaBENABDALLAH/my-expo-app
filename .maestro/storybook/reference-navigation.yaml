appId: com.hyrkul.likan
name: Navbar selects destinations and fires one enabled context action
tags: [storybook, navigation]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-reference-navigation--context-switching
      READY_ID: navigation-story-state
- assertVisible: 'Selected: index; action presses: 0'
- assertVisible:
    id: navigation-story-action
    text: Create recipe
- tapOn:
    id: tab-search
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: search; action presses: 0'
- assertVisible:
    id: navigation-story-action
    text: Open search filters
- tapOn:
    id: tab-context-action
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: search; action presses: 1'
- tapOn:
    id: tab-recipes
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: recipes; action presses: 1'
- assertVisible:
    id: navigation-story-action
    text: Open liked recipes and favorites
- tapOn:
    id: tab-more
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: more; action presses: 1'
- assertVisible:
    id: navigation-story-action
    text: Open profile preferences
- tapOn:
    id: tab-home
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: index; action presses: 1'
- tapOn:
    id: tab-context-action
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: index; action presses: 2'
- tapOn:
    id: tab-context-action
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: index; action presses: 3'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-reference-navigation--disabled
      READY_ID: navigation-story-state
- tapOn:
    id: tab-context-action
    index: 0
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: index; action presses: 0'
# The clipped dock must not clip or intercept the raised action's hit area.
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-reference-navigation--dock-feedback
      READY_ID: navigation-story-state
- tapOn:
    id: tab-more
    index: 0
    waitToSettleTimeoutMs: 1000
    point: '50%,10%'
- assertVisible: 'Selected: more; action presses: 0'
- tapOn:
    id: tab-context-action
    index: 0
    waitToSettleTimeoutMs: 1000
    point: '50%,5%'
- assertVisible: 'Selected: more; action presses: 1'
- tapOn:
    id: tab-context-action
    index: 0
    waitToSettleTimeoutMs: 1000
    point: '50%,95%'
- assertVisible: 'Selected: more; action presses: 2'
- tapOn:
    id: tab-home
    index: 0
    waitToSettleTimeoutMs: 1000
    point: '50%,10%'
- assertVisible: 'Selected: index; action presses: 2'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-reference-navigation--page-overlap
      READY_ID: navigation-story-page-action
- tapOn:
    id: navigation-story-page-action
    point: '50%,80%'
- assertVisible: 'Page presses: 1'
- tapOn:
    id: tab-context-action
    point: '50%,5%'
    waitToSettleTimeoutMs: 1000
- assertVisible: 'Selected: index; action presses: 1'
