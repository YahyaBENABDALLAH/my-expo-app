appId: com.hyrkul.likan
name: Toast variants dismiss and can be shown again
tags: [smoke, storybook]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-toast--dark
      READY_ID: toast-story-show
- tapOn:
    id: toast-story-show
- assertVisible: 'The email, username, or password is incorrect.'
- assertVisible:
    id: toast-title
- assertVisible: 'State: Visible. Dismissals: 0'
- tapOn:
    id: toast-dismiss
- assertVisible: 'State: Hidden. Dismissals: 1'
- assertNotVisible: 'The email, username, or password is incorrect.'
- tapOn:
    id: toast-story-show
- assertVisible: 'The email, username, or password is incorrect.'
- assertVisible: 'State: Visible. Dismissals: 1'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-toast--success
      READY_ID: toast-story-show
- tapOn:
    id: toast-story-show
- assertVisible: 'Your recipe has been saved.'
- assertVisible:
    id: toast-title
- tapOn:
    id: toast-dismiss
- assertVisible: 'State: Hidden. Dismissals: 1'
- assertNotVisible: 'Your recipe has been saved.'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-toast--warning
      READY_ID: toast-story-show
- tapOn:
    id: toast-story-show
- assertVisible: 'Your changes have not been saved yet.'
- assertVisible:
    id: toast-title
- tapOn:
    id: toast-dismiss
- assertVisible: 'State: Hidden. Dismissals: 1'
- assertNotVisible: 'Your changes have not been saved yet.'
