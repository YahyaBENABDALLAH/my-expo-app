appId: com.hyrkul.likan
name: Button geometry keeps the full surface clickable and suppresses disabled presses
tags: [smoke, storybook]
env:
  STORYBOOK_URL: myappexpo://storybook
  GEOMETRY_STORY: expo-ui-universal-button--geometry-light
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: '${GEOMETRY_STORY}'
      READY_ID: button-geometry-default
- tapOn:
    id: button-geometry-default
- assertVisible: 'Presses: 1'
- tapOn:
    id: button-geometry-rounded
- assertVisible: 'Presses: 2'
- tapOn:
    id: button-geometry-square
    point: '50%,10%'
- assertVisible: 'Presses: 3'
- tapOn:
    id: button-geometry-square
    point: '50%,90%'
- assertVisible: 'Presses: 4'
- tapOn:
    id: button-geometry-toggle
- tapOn:
    id: button-geometry-rounded
- tapOn:
    id: button-geometry-square
- assertVisible: 'Presses: 4'
- tapOn:
    id: button-geometry-toggle
- tapOn:
    id: button-geometry-square
- assertVisible: 'Presses: 5'
