appId: com.hyrkul.likan
name: Wave-only blur, scrolling headers and native back arrow in both themes
tags: [smoke, storybook, navigation]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: pages-navigation-shell--default
      READY_ID: page-title
- assertNotVisible:
    id: page-back
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=pages-navigation-shell--blurred-header&mode=canvas'
- extendedWaitUntil:
    visible:
      id: page-blur-item-1
    timeout: 30000
- swipe:
    start: 50%, 80%
    end: 50%, 30%
- assertVisible:
    id: page-title
    text: Saved recipes
- tapOn:
    id: page-back
- scrollUntilVisible:
    element:
      id: page-back-presses
    direction: UP
- assertVisible:
    id: page-back-presses
    text: 'Back presses: 1'
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=pages-navigation-shell--animated-waves&mode=canvas'
- extendedWaitUntil:
    visible:
      id: page-blur-item-1
    timeout: 30000
- swipe:
    start: 50%, 80%
    end: 50%, 30%
- assertVisible:
    id: page-title
    text: Saved recipes
- tapOn:
    id: page-back
- scrollUntilVisible:
    element:
      id: page-back-presses
    direction: UP
- assertVisible:
    id: page-back-presses
    text: 'Back presses: 1'
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=pages-navigation-shell--dark-blurred-header&mode=canvas'
- extendedWaitUntil:
    visible:
      id: page-blur-item-1
    timeout: 30000
- swipe:
    start: 50%, 80%
    end: 50%, 30%
- assertVisible:
    id: page-title
    text: Saved recipes
- tapOn:
    id: page-back
- scrollUntilVisible:
    element:
      id: page-back-presses
    direction: UP
- assertVisible:
    id: page-back-presses
    text: 'Back presses: 1'
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=pages-navigation-shell--header-with-back-arrow&mode=canvas'
- extendedWaitUntil:
    visible:
      id: page-back
    timeout: 30000
- tapOn:
    id: page-back
- assertVisible:
    id: page-back-presses
    text: 'Back presses: 1'
- tapOn:
    id: page-back
- assertVisible:
    id: page-back-presses
    text: 'Back presses: 2'
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=pages-navigation-shell--dark-header-with-back-arrow&mode=canvas'
- extendedWaitUntil:
    visible:
      id: page-back-presses
      text: 'Back presses: 0'
    timeout: 30000
- tapOn:
    id: page-back
- assertVisible:
    id: page-back-presses
    text: 'Back presses: 1'
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=pages-navigation-shell--dark&mode=canvas'
- extendedWaitUntil:
    visible:
      id: page-title
      text: My recipes
    timeout: 30000
- assertNotVisible:
    id: page-back
