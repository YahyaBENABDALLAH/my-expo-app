appId: com.hyrkul.likan
name: Skeleton placeholders support CSS pause and resume
tags: [storybook, motion]
env:
  STORYBOOK_URL: myappexpo://storybook
  STORY_ID: expo-ui-skeleton--animation-controls
  READY_ID: skeleton-toggle-animation
---
- runFlow: ../helpers/open-story.yaml
- assertVisible:
    id: skeleton-css-fixed
- assertVisible:
    id: skeleton-css-fill
- assertVisible: Animation playing
- tapOn:
    id: skeleton-toggle-animation
    waitToSettleTimeoutMs: 1000
- assertVisible: Animation paused
- tapOn:
    id: skeleton-toggle-animation
    waitToSettleTimeoutMs: 1000
- assertVisible: Animation playing
