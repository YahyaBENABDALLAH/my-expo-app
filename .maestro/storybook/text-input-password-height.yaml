appId: com.hyrkul.likan
name: Password icon toggles visibility without changing field height
tags: [storybook, input]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-text-input--password-visibility
      READY_ID: expo-ui-text-input-right-icon
- tapOn:
    id: expo-ui-text-input-record-height
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
- tapOn:
    id: expo-ui-text-input-right-icon
- assertVisible:
    id: expo-ui-text-input-visibility
    text: 'Password: visible'
- assertVisible:
    id: expo-ui-text-input
    text: Example123!
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
- tapOn:
    id: expo-ui-text-input-right-icon
- assertVisible:
    id: expo-ui-text-input-visibility
    text: 'Password: hidden'
- assertNotVisible:
    id: expo-ui-text-input
    text: Example123!
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
- tapOn:
    id: expo-ui-text-input
- eraseText
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
- tapOn:
    id: expo-ui-text-input-right-icon
- assertVisible:
    id: expo-ui-text-input-visibility
    text: 'Password: visible'
- tapOn:
    id: expo-ui-text-input
- inputText: NewPassword456!
- assertVisible:
    id: expo-ui-text-input
    text: NewPassword456!
- hideKeyboard
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
- tapOn:
    id: expo-ui-text-input-right-icon
- assertVisible:
    id: expo-ui-text-input-visibility
    text: 'Password: hidden'
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-text-input--password-visibility-large-text
      READY_ID: expo-ui-text-input-right-icon
- tapOn:
    id: expo-ui-text-input-record-height
- tapOn:
    id: expo-ui-text-input-right-icon
- assertVisible:
    id: expo-ui-text-input-visibility
    text: 'Password: visible'
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
- tapOn:
    id: expo-ui-text-input-right-icon
- assertVisible:
    id: expo-ui-text-input-visibility
    text: 'Password: hidden'
- assertVisible:
    id: expo-ui-text-input-height-change
    text: 'Height change: 0'
