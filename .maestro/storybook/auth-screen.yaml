appId: com.hyrkul.likan
name: Shared native Host validates, edits, and submits the form
tags: [smoke, storybook, auth]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-auth-screen--shared-host
      READY_ID: native-form-submit
- tapOn:
    id: native-form-submit
- assertVisible:
    id: native-form-login-error
    text: Enter your email or username.
- tapOn:
    id: native-form-login
- inputText: alex@example.com
- tapOn:
    id: native-form-password
- inputText: example-password
- hideKeyboard
- assertNotVisible:
    id: native-form-login-error
- assertNotVisible:
    id: native-form-password-error
- tapOn:
    id: native-form-password-visibility
- assertVisible: Hide password
- tapOn:
    id: native-form-submit
- assertVisible:
    id: native-form-submit-status
    text: 'Submissions: 1'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-auth-screen--pending
      READY_ID: native-form-submit
- tapOn:
    id: native-form-submit
- assertVisible:
    id: native-form-submit-status
    text: 'Submissions: 0'
