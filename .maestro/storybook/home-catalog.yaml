appId: com.hyrkul.likan
name: Home Details opens, closes, and reopens with the correct recipe
tags: [smoke, storybook, home]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: recipes-home-catalog--dark
      READY_ID: home-card-hero-sample-1-open
- repeat:
    times: 3
    commands:
      - tapOn:
          id: home-card-hero-sample-1-open
      - extendedWaitUntil:
          visible:
            id: home-sample-preview-item-sample-1
          timeout: 10000
      - assertVisible:
          id: home-sample-preview-title
      - assertVisible:
          id: home-sample-preview-description
      - assertVisible:
          id: home-sample-preview-close
      - tapOn:
          id: home-sample-preview-close
      - extendedWaitUntil:
          notVisible:
            id: home-sample-preview-title
          timeout: 10000
      - assertVisible:
          id: home-card-hero-sample-1-open
- tapOn:
    id: home-card-hero-sample-1-open
- extendedWaitUntil:
    visible:
      id: home-sample-preview-title
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: home-sample-preview-close
- extendedWaitUntil:
    notVisible:
      id: home-sample-preview-title
    timeout: 10000
- swipe:
    from:
      id: home-card-hero-sample-1-save
    direction: LEFT
    duration: 500
- extendedWaitUntil:
    visible:
      id: home-card-hero-sample-2-open
    timeout: 10000
- tapOn:
    id: home-card-hero-sample-2-open
- extendedWaitUntil:
    visible:
      id: home-sample-preview-item-sample-2
    timeout: 10000
- assertNotVisible:
    id: home-sample-preview-item-sample-1
- tapOn:
    id: home-sample-preview-close
- extendedWaitUntil:
    notVisible:
      id: home-sample-preview-title
    timeout: 10000
- scrollUntilVisible:
    element:
      id: home-card-catalog-sample-8-open
    direction: DOWN
    timeout: 60000
- tapOn:
    id: home-card-catalog-sample-8-open
- extendedWaitUntil:
    visible:
      id: home-sample-preview-item-sample-8
    timeout: 10000
- assertNotVisible:
    id: home-sample-preview-item-sample-2
- tapOn:
    id: home-sample-preview-close
- extendedWaitUntil:
    notVisible:
      id: home-sample-preview-title
    timeout: 10000
