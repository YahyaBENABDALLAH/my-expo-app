appId: com.hyrkul.likan
name: Direct story links survive lazy loading and browser/canvas switches
tags: [smoke, storybook]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: expo-ui-universal-button--interaction
      READY_ID: button-count
- tapOn:
    id: button-count
- assertVisible: 'Presses: 1'
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=expo-ui-universal-checkbox--unchecked'
- extendedWaitUntil:
    visible:
      id: expo-ui-checkbox-value
    timeout: 60000
- assertVisible:
    id: mobile-menu-button
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=expo-ui-universal-button--interaction&mode=canvas'
- extendedWaitUntil:
    visible:
      id: button-count
    timeout: 60000
- assertNotVisible:
    id: mobile-menu-button
- tapOn:
    id: button-count
- assertVisible: 'Presses: 1'
