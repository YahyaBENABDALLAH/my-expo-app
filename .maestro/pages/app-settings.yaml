appId: com.hyrkul.likan
name: Theme, system appearance and language are changed in grouped App Settings
tags: [pages, theme, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: more
      PAGE_TITLE: '.*'
- scrollUntilVisible:
    element:
      id: page-action-app-settings
- tapOn:
    id: page-action-app-settings
- extendedWaitUntil:
    visible:
      id: app-settings-groups
    timeout: 60000
- scrollUntilVisible:
    element:
      id: app-settings-theme-picker
- assertNotVisible:
    id: page-appearance-footer
- assertNotVisible:
    id: page-layout-direction-switch
- assertNotVisible:
    id: page-language-picker
- scrollUntilVisible:
    element:
      id: app-settings-language
- tapOn:
    id: app-settings-language
- assertVisible:
    id: app-settings-language-title
- tapOn:
    id: app-settings-language-en
- assertNotVisible:
    id: app-settings-language-title
- assertVisible: English
- tapOn:
    id: app-settings-language
- tapOn:
    id: app-settings-language-ar
- assertNotVisible:
    id: app-settings-language-title
- assertVisible: العربية
- tapOn:
    id: app-settings-language
- tapOn:
    id: app-settings-language-en
- assertNotVisible:
    id: app-settings-language-title
- assertVisible: English
- tapOn:
    id: app-settings-language
- tapOn:
    id: app-settings-language-close
- assertNotVisible:
    id: app-settings-language-title
- scrollUntilVisible:
    element:
      id: app-settings-theme-picker
- tapOn:
    id: app-settings-theme-picker
- tapOn: Facebook
- assertVisible: Facebook
- tapOn:
    id: app-settings-theme-picker
- tapOn: UX Template
- assertVisible: UX Template
- tapOn:
    id: app-settings-color-scheme-picker
- tapOn: Light Mode
- assertVisible: Light Mode
- tapOn:
    id: app-settings-color-scheme-picker
- tapOn: Dark Mode
- assertVisible: Dark Mode
- tapOn:
    id: page-back
- assertNotVisible:
    id: app-settings-theme-picker
- assertNotVisible:
    id: app-settings-color-scheme-picker
- scrollUntilVisible:
    element:
      id: page-action-app-settings
- tapOn:
    id: page-action-app-settings
- extendedWaitUntil:
    visible:
      id: app-settings-groups
    timeout: 60000
- scrollUntilVisible:
    element:
      id: app-settings-theme-picker
- assertVisible: UX Template
- assertVisible: Dark Mode
- tapOn:
    id: app-settings-theme-picker
- tapOn: WhatsApp
- assertVisible: WhatsApp
- tapOn:
    id: app-settings-color-scheme-picker
- tapOn: System
- assertVisible: System
- tapOn:
    id: page-back
- scrollUntilVisible:
    element:
      id: page-action-app-settings
- tapOn:
    id: page-action-app-settings
- extendedWaitUntil:
    visible:
      id: app-settings-groups
    timeout: 60000
- scrollUntilVisible:
    element:
      id: app-settings-color-scheme-picker
- assertVisible: System
- scrollUntilVisible:
    element:
      id: app-settings-language
- assertVisible: English
- tapOn:
    id: app-settings-language
- tapOn:
    id: app-settings-language-fr
- assertNotVisible:
    id: app-settings-language-title
