appId: com.hyrkul.likan
name: Development guest browses without a login and exits
tags: [pages, navigation, signed-out, development]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: auth-development-guest
    timeout: 15000
- tapOn:
    id: auth-development-guest
- assertVisible:
    id: page-title
    text: All pages
- scrollUntilVisible:
    element:
      id: page-action-home
- tapOn:
    id: page-action-home
- assertVisible:
    id: home-browse-pages
- tapOn:
    id: home-browse-pages
- assertVisible:
    id: page-title
    text: All pages
- tapOn:
    id: development-guest-exit
- assertVisible:
    id: auth-login
