appId: com.hyrkul.likan
name: More links open tools and detail pages
tags: [pages, navigation, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: more
      PAGE_TITLE: More
- scrollUntilVisible:
    element:
      id: page-action-ingredients
- tapOn:
    id: page-action-ingredients
- assertVisible:
    id: page-title
    text: Ingredients
- tapOn:
    id: page-back
- assertVisible:
    id: page-title
    text: More
- scrollUntilVisible:
    element:
      id: page-action-become-a-chef
- tapOn:
    id: page-action-become-a-chef
- assertVisible:
    id: page-title
    text: Become a chef
- tapOn:
    id: page-back
- assertVisible:
    id: page-title
    text: More
- scrollUntilVisible:
    element:
      id: page-action-device-information
- tapOn:
    id: page-action-device-information
- assertVisible:
    id: page-title
    text: Device information
- tapOn:
    id: page-back
- assertVisible:
    id: page-title
    text: More
- scrollUntilVisible:
    element:
      id: page-action-health-check
- tapOn:
    id: page-action-health-check
- assertVisible:
    id: page-title
    text: Health check
- tapOn:
    id: page-back
- assertVisible:
    id: page-title
    text: More
