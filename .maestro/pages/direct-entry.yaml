appId: com.hyrkul.likan
name: Direct detail links, filters, aliases, and invalid routes
tags: [pages, navigation, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: recipe/00000000-0000-4000-8000-000000000001
      PAGE_TITLE: Recipe
- openLink: myappexpo://category/00000000-0000-4000-8000-000000000001
- assertVisible:
    id: page-title
    text: Category
- openLink: myappexpo://recipe/invalid%21
- assertVisible:
    id: page-title
    text: Invalid recipe link
- openLink: myappexpo://category/invalid%21
- assertVisible:
    id: page-title
    text: Invalid category link
- openLink: 'myappexpo://search?q=tagine&categoryUuid=c1&cuisineUuid=c2&difficultyUuid=d1'
- assertVisible:
    id: page-title
    text: Search
- assertVisible: 'Searching for: c1, c2, d1'
- assertVisible:
    id: recipe-search-input
    text: tagine
- openLink: 'myappexpo://my-recipes/liked-favorites?tab=favorite'
- assertVisible:
    id: page-title
    text: Favorites
- openLink: myappexpo://main
- assertVisible:
    id: page-title
    text: Create a recipe
- openLink: myappexpo://missing-page
- assertVisible:
    id: page-title
    text: Page not found
- tapOn:
    id: page-action-go-home
- assertVisible:
    id: page-title
    text: Home
