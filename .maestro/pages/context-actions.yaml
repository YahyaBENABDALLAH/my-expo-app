appId: com.hyrkul.likan
name: Reference context actions follow the selected tab
tags: [pages, navigation, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: search
      PAGE_TITLE: Search
- tapOn:
    id: tab-context-action
- assertVisible:
    id: search-filter-title
- tapOn:
    id: search-filter-done
- tapOn:
    id: tab-more
- tapOn:
    id: tab-context-action
- assertVisible:
    id: profile-preferences-title
- tapOn:
    id: profile-preferences-done
- tapOn:
    id: tab-recipes
- tapOn:
    id: tab-context-action
- assertVisible:
    id: page-title
    text: Liked recipes
- openLink: myappexpo://create-recipe
- assertVisible:
    id: recipe-step-label
    text: 'Step 1 of 4: Info'
- scrollUntilVisible:
    element:
      id: recipe-continue
- tapOn:
    id: recipe-continue
- assertVisible:
    id: recipe-form-error
- assertVisible:
    id: recipe-step-label
    text: 'Step 1 of 4: Info'
