appId: com.hyrkul.likan
name: Tabs and detail pages have no preference footer
tags: [pages, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: more
      PAGE_TITLE: '.*'
- assertNotVisible:
    id: page-appearance-footer
- assertNotVisible:
    id: page-layout-direction-switch
- tapOn:
    id: tab-home
- assertNotVisible:
    id: page-appearance-footer
- tapOn:
    id: tab-search
- assertNotVisible:
    id: page-language-picker
- assertNotVisible:
    id: page-theme-picker
- tapOn:
    id: tab-recipes
- assertNotVisible:
    id: page-appearance-footer
- tapOn:
    id: tab-more
- scrollUntilVisible:
    element:
      id: page-action-device-information
- tapOn:
    id: page-action-device-information
- assertVisible:
    id: page-back
- assertNotVisible:
    id: page-appearance-footer
- assertNotVisible:
    id: page-layout-direction-switch
- assertNotVisible:
    id: page-language-picker
- assertNotVisible:
    id: page-theme-picker
- tapOn:
    id: page-back
- scrollUntilVisible:
    element:
      id: page-action-app-settings
