appId: com.hyrkul.likan
name: Page footers change direction, mode and brand while retaining component state
tags: [pages, theme, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: ui-component/switch
      PAGE_TITLE: Switch
- scrollUntilVisible:
    element:
      id: page-appearance-footer
- scrollUntilVisible:
    element:
      id: demo-switch
- tapOn:
    id: demo-switch
- scrollUntilVisible:
    element:
      text: Notifications on
- assertVisible: Notifications on
- scrollUntilVisible:
    element:
      id: page-theme-picker
- tapOn:
    id: page-theme-picker
- tapOn: Facebook
- scrollUntilVisible:
    element:
      text: Notifications on
- assertVisible: Notifications on
- scrollUntilVisible:
    element:
      id: page-color-scheme-switch
- tapOn:
    id: page-color-scheme-switch
- scrollUntilVisible:
    element:
      text: Notifications on
- assertVisible: Notifications on
- scrollUntilVisible:
    element:
      id: page-layout-direction-switch
- tapOn:
    id: page-layout-direction-switch
- scrollUntilVisible:
    element:
      text: Notifications on
- assertVisible: Notifications on
- scrollUntilVisible:
    element:
      id: page-theme-picker
- tapOn:
    id: page-theme-picker
- tapOn: Instagram
- scrollUntilVisible:
    element:
      text: Notifications on
- assertVisible: Notifications on
- scrollUntilVisible:
    element:
      id: page-theme-picker
- tapOn:
    id: page-theme-picker
- tapOn: TikTok
- scrollUntilVisible:
    element:
      text: Notifications on
- assertVisible: Notifications on
- openLink: myappexpo://ui-component/input
- extendedWaitUntil:
    visible:
      id: demo-input
    timeout: 60000
- scrollUntilVisible:
    element:
      id: page-appearance-footer
- assertVisible: TikTok
- scrollUntilVisible:
    element:
      id: demo-input
- tapOn:
    id: demo-input
- inputText: Draft 123
- hideKeyboard
- scrollUntilVisible:
    element:
      id: page-color-scheme-switch
- tapOn:
    id: page-color-scheme-switch
- scrollUntilVisible:
    element:
      id: page-theme-picker
- tapOn:
    id: page-theme-picker
- tapOn: WhatsApp
- scrollUntilVisible:
    element:
      text: 'Draft: Draft 123'
- assertVisible: 'Draft: Draft 123'
- scrollUntilVisible:
    element:
      id: page-layout-direction-switch
- runFlow:
    when:
      visible:
        id: page-layout-direction-switch
        checked: true
    commands:
      - tapOn:
          id: page-layout-direction-switch
