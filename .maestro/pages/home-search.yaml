appId: com.hyrkul.likan
name: Home search opens the focused Search tab and returns
tags: [pages, navigation, input, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: ''
      PAGE_TITLE: Home
- tapOn:
    id: home-search
- assertVisible:
    id: page-title
    text: Search
- assertVisible:
    id: recipe-search-input
    focused: true
- inputText: couscous
- tapOn:
    id: search-cancel
- assertVisible:
    id: page-title
    text: Home
- assertVisible:
    id: home-search
- tapOn:
    id: home-search
- assertVisible:
    id: recipe-search-input
    text: couscous
    focused: true
- tapOn:
    id: recipe-search-input-right-icon
- assertNotVisible:
    id: recipe-search-input
    text: couscous
- hideKeyboard
- tapOn:
    id: tab-home
- tapOn:
    id: tab-search
- assertVisible:
    id: recipe-search-input
    focused: false
