appId: com.hyrkul.likan
name: Four reference tabs and recipe collections
tags: [pages, navigation, signed-in]
---
- runFlow:
    file: ../helpers/open-page.yaml
    env:
      PAGE_ROUTE: ''
      PAGE_TITLE: Home
- assertNotVisible:
    id: page-back
- tapOn:
    id: tab-search
- assertVisible:
    id: page-title
    text: Search
- tapOn:
    id: tab-home
- tapOn:
    id: tab-context-action
- assertVisible:
    id: page-title
    text: Create a recipe
- tapOn:
    id: tab-recipes
- assertVisible:
    id: page-title
    text: My recipes
- tapOn:
    id: page-action-liked-and-favorite-recipes
- assertVisible:
    id: page-title
    text: Liked recipes
- assertVisible:
    id: page-back
- tapOn:
    id: page-action-favorites
- assertVisible:
    id: page-title
    text: Favorites
- tapOn:
    id: page-action-liked-recipes
- assertVisible:
    id: page-title
    text: Liked recipes
- tapOn:
    id: page-back
- assertVisible:
    id: page-title
    text: My recipes
- assertNotVisible:
    id: page-back
- openLink: myappexpo://recipes
- tapOn:
    id: page-action-history
- assertVisible:
    id: page-title
    text: History
- tapOn:
    id: page-back
- assertVisible:
    id: page-title
    text: My recipes
- tapOn:
    id: page-action-creations
- assertVisible:
    id: page-title
    text: Creations
- tapOn:
    id: page-action-create-a-recipe
- assertVisible:
    id: page-title
    text: Create a recipe
- tapOn:
    id: tab-more
- assertVisible:
    id: page-title
    text: More
- tapOn:
    id: tab-home
- assertVisible:
    id: page-title
    text: Home
