appId: com.hyrkul.likan
name: Registration password confirmation and correction
tags: [smoke, auth]
---
- runFlow:
    file: ../helpers/open-auth.yaml
    env:
      AUTH_ROUTE: register
      READY_ID: auth-register-username
- assertNotVisible:
    id: auth-register-username-error
- tapOn:
    id: auth-register-username
- inputText: alex_morgan
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-register-email
- tapOn:
    id: auth-register-email
- inputText: alex@example.com
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-register-password
- tapOn:
    id: auth-register-password
- inputText: example-password
- hideKeyboard
- tapOn:
    id: auth-register-password-right-icon
- assertVisible:
    id: auth-register-password
    text: example-password
- tapOn:
    id: auth-register-password-right-icon
- assertNotVisible:
    id: auth-register-password
    text: example-password
- scrollUntilVisible:
    element:
      id: auth-register-confirm-password
- tapOn:
    id: auth-register-confirm-password
- inputText: wrong-password
- hideKeyboard
- tapOn:
    id: auth-register-confirm-password-right-icon
- assertVisible:
    id: auth-register-confirm-password
    text: wrong-password
- tapOn:
    id: auth-register-confirm-password-right-icon
- assertNotVisible:
    id: auth-register-confirm-password
    text: wrong-password
- scrollUntilVisible:
    element:
      id: auth-register-submit
- tapOn:
    id: auth-register-submit
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-register-confirm-password-error
- assertVisible:
    id: auth-register-confirm-password-error
    text: Passwords do not match.
- tapOn:
    id: auth-register-confirm-password
- eraseText
- inputText: example-password
- hideKeyboard
- assertNotVisible:
    id: auth-register-confirm-password-error
- scrollUntilVisible:
    element:
      id: auth-register-login
- tapOn:
    id: auth-register-login
- assertVisible:
    id: auth-login-email
