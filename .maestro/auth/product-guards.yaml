appId: com.hyrkul.likan
name: Signed-out product links remain behind Login
tags: [auth, navigation, guards]
---
- runFlow:
    file: ../helpers/open-auth.yaml
    env:
      AUTH_ROUTE: recipe/00000000-0000-4000-8000-000000000001
      READY_ID: auth-login-email
- assertNotVisible:
    id: page-title
- openLink: myappexpo://category/00000000-0000-4000-8000-000000000001
- assertVisible:
    id: auth-login-email
- assertNotVisible:
    id: page-title
- openLink: myappexpo://my-recipes/liked-favorites?tab=favorite
- assertVisible:
    id: auth-login-email
- assertNotVisible:
    id: page-title
- openLink: myappexpo://create-recipe
- assertVisible:
    id: auth-login-email
- assertNotVisible:
    id: page-title
