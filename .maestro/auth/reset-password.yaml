appId: com.hyrkul.likan
name: Password recovery link prerequisites and validation
tags: [auth, navigation, validation]
---
- runFlow:
    file: ../helpers/open-auth.yaml
    env:
      AUTH_ROUTE: reset-password
      READY_ID: auth-reset-password-recovery
- assertNotVisible:
    id: auth-reset-password-code
- tapOn:
    id: auth-reset-password-recovery
- assertVisible:
    id: auth-forgot-password-email
- openLink: 'myappexpo://reset-password?challengeId=00000000-0000-4000-8000-000000000001'
- assertVisible:
    id: auth-reset-password-code
- scrollUntilVisible:
    element:
      id: auth-reset-password-submit
- tapOn:
    id: auth-reset-password-submit
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-reset-password-code-error
    direction: UP
- assertVisible:
    id: auth-reset-password-code-error
    text: Enter the 6-digit recovery code.
- scrollUntilVisible:
    element:
      id: auth-reset-password-new-password-error
- assertVisible:
    id: auth-reset-password-new-password-error
    text: Use at least 8 characters.
- scrollUntilVisible:
    element:
      id: auth-reset-password-login
- tapOn:
    id: auth-reset-password-login
- assertVisible:
    id: auth-login-email
