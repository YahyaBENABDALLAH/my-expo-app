appId: com.hyrkul.likan
name: Auth pages have no preference footer and retain the login draft after recovery
tags: [auth, signed-out]
---
- runFlow:
    file: ../helpers/open-auth.yaml
    env:
      AUTH_ROUTE: login
      READY_ID: auth-login
- assertVisible:
    id: auth-login-language
- assertVisible:
    id: auth-login-color-scheme
- tapOn:
    id: auth-login-email
- inputText: draft@example.com
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-login-forgot-password
- assertNotVisible:
    id: page-appearance-footer
- assertNotVisible:
    id: page-layout-direction-switch
- assertNotVisible:
    id: page-language-picker
- assertNotVisible:
    id: page-theme-picker
- tapOn:
    id: auth-login-forgot-password
- extendedWaitUntil:
    visible:
      id: auth-forgot-password
    timeout: 60000
- assertNotVisible:
    id: auth-login-language
- assertNotVisible:
    id: auth-login-color-scheme
- assertNotVisible:
    id: page-appearance-footer
- assertNotVisible:
    id: page-layout-direction-switch
- assertNotVisible:
    id: page-language-picker
- assertNotVisible:
    id: page-theme-picker
- tapOn:
    id: auth-forgot-password-login
- extendedWaitUntil:
    visible:
      id: auth-login
    timeout: 60000
- assertVisible:
    id: auth-login-email
    text: draft@example.com
