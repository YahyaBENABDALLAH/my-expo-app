appId: com.hyrkul.likan
name: Login validation and password visibility
tags: [smoke, auth]
---
- runFlow:
    file: ../helpers/open-auth.yaml
    env:
      AUTH_ROUTE: login
      READY_ID: auth-login-submit
- assertNotVisible:
    id: auth-login-email-error
- tapOn:
    id: auth-login-submit
- hideKeyboard
- assertVisible:
    id: auth-login-email-error
    text: Email or username is required.
- assertVisible:
    id: auth-login-password-error
    text: Password must contain at least 8 characters.
- tapOn:
    id: auth-login-email
- inputText: alex@example.com
- tapOn:
    id: auth-login-password
- inputText: example-password
- hideKeyboard
- assertNotVisible:
    id: auth-login-email-error
- assertNotVisible:
    id: auth-login-password-error
- tapOn:
    id: auth-login-password-right-icon
- assertVisible:
    id: auth-login-password
    text: example-password
- assertVisible: Hide password
- tapOn:
    id: auth-login-password-right-icon
- assertVisible: Show password
- assertNotVisible:
    id: auth-login-password
    text: example-password
- tapOn:
    id: auth-login-forgot-password
- assertVisible:
    id: auth-forgot-password-email
