appId: com.hyrkul.likan
name: Password recovery email validation
tags: [smoke, auth]
---
- runFlow:
    file: ../helpers/open-auth.yaml
    env:
      AUTH_ROUTE: forgot-password
      READY_ID: auth-forgot-password-submit
- assertNotVisible:
    id: auth-forgot-password-email-error
- tapOn:
    id: auth-forgot-password-email
- inputText: invalid
- hideKeyboard
- tapOn:
    id: auth-forgot-password-submit
- hideKeyboard
- assertVisible:
    id: auth-forgot-password-email-error
    text: Enter a valid email address.
- tapOn:
    id: auth-forgot-password-email
- eraseText
- inputText: alex@example.com
- hideKeyboard
- assertNotVisible:
    id: auth-forgot-password-email-error
- tapOn:
    id: auth-forgot-password-login
- assertVisible:
    id: auth-login-email
