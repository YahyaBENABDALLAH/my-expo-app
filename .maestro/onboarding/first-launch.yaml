appId: com.hyrkul.likan
name: First-launch introduction completes once
tags: [onboarding, navigation, smoke]
env:
  DEV_CLIENT_URL: myappexpo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
---
- launchApp:
    clearState: true
- openLink: '${DEV_CLIENT_URL}'
- extendedWaitUntil:
    visible:
      id: app-ready
    timeout: 60000
- assertVisible:
    id: onboarding-discover
- assertNotVisible:
    id: auth-login-submit
- assertVisible:
    id: onboarding-next
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-cook
- assertVisible:
    id: onboarding-back
- tapOn:
    id: onboarding-back
- assertVisible:
    id: onboarding-discover
- swipe:
    start: 80%, 30%
    end: 20%, 30%
    duration: 400
- assertVisible:
    id: onboarding-cook
- swipe:
    start: 20%, 30%
    end: 80%, 30%
    duration: 400
- assertVisible:
    id: onboarding-discover
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-cook
- swipe:
    start: 80%, 30%
    end: 20%, 30%
    duration: 400
- assertVisible:
    id: onboarding-save
- back
- assertVisible:
    id: onboarding-cook
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-save
- assertVisible:
    id: onboarding-start
- swipe:
    start: 80%, 30%
    end: 20%, 30%
    duration: 400
- assertVisible:
    id: onboarding-save
- assertNotVisible:
    id: auth-login-submit
- tapOn:
    id: onboarding-start
- extendedWaitUntil:
    visible:
      id: auth-login-submit
    timeout: 10000
- runFlow: ../helpers/bootstrap-app.yaml
- assertVisible:
    id: auth-login-submit
- assertNotVisible:
    id: onboarding-discover
- back
- assertNotVisible:
    id: onboarding-save
