appId: com.hyrkul.likan
name: Skipping the introduction persists across launches
tags: [onboarding, navigation]
env:
  DEV_CLIENT_URL: myappexpo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
---
- launchApp:
    clearState: true
- openLink: '${DEV_CLIENT_URL}'
- extendedWaitUntil:
    visible:
      id: app-ready
    timeout: 60000
- assertVisible:
    id: onboarding-discover
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible:
      id: auth-login-submit
    timeout: 10000
- runFlow: ../helpers/bootstrap-app.yaml
- assertVisible:
    id: auth-login-submit
- assertNotVisible:
    id: onboarding-discover
