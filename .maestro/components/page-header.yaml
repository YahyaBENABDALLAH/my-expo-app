appId: com.hyrkul.likan
name: Blurred headers keep back actions usable before and after scrolling
tags: [smoke, storybook]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: components-page-header--app-settings
      READY_ID: app-settings-groups
- assertVisible:
    id: page-title
- tapOn:
    id: page-back
- assertVisible:
    id: settings-header-back-count
    text: 'Back presses: 1'
- swipe:
    start: 50%, 70%
    end: 50%, 35%
- assertVisible:
    id: page-title
- tapOn:
    id: page-back
- assertVisible:
    id: settings-header-back-count
    text: 'Back presses: 2'
- takeScreenshot: app-settings-header-blur-after-scroll
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: components-page-header--dark-app-settings
      READY_ID: app-settings-groups
- swipe:
    start: 50%, 70%
    end: 50%, 35%
- assertVisible:
    id: page-title
- tapOn:
    id: page-back
- assertVisible:
    id: settings-header-back-count
    text: 'Back presses: 1'
- takeScreenshot: dark-app-settings-header-blur-after-scroll
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: components-page-header--default
      READY_ID: page-header-back-count
- tapOn:
    id: page-back
- assertVisible:
    id: page-header-back-count
    text: 'Back presses: 1'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: components-page-header--scrolling
      READY_ID: page-header-back-count
- swipe:
    start: 50%, 75%
    end: 50%, 35%
- tapOn:
    id: page-back
- scrollUntilVisible:
    element:
      id: page-header-back-count
    direction: UP
- assertVisible:
    id: page-header-back-count
    text: 'Back presses: 1'
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: components-page-header--dark
      READY_ID: page-header-back-count
- tapOn:
    id: page-back
- assertVisible:
    id: page-header-back-count
    text: 'Back presses: 1'
