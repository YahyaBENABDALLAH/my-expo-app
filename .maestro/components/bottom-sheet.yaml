appId: com.hyrkul.likan
name: Bottom sheet opens and closes
tags: [smoke, storybook]
env:
  STORYBOOK_URL: myappexpo://storybook
---
- runFlow:
    file: ../helpers/open-story.yaml
    env:
      STORY_ID: components-bottom-sheet--fixed-content-height
      READY_ID: expo-ui-bottom-sheet-open
- assertVisible:
    id: expo-ui-bottom-sheet-state
    text: 'State: Closed.*'

- tapOn:
    id: expo-ui-bottom-sheet-open
- assertVisible:
    id: expo-ui-bottom-sheet-title
    text: A native bottom sheet
- tapOn:
    id: expo-ui-bottom-sheet-close
- assertNotVisible:
    id: expo-ui-bottom-sheet-title
- assertVisible:
    id: expo-ui-bottom-sheet-state
    text: 'State: Closed.*'
