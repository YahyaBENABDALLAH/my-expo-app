appId: com.hyrkul.likan
env:
  DEV_CLIENT_URL: myappexpo://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
---
- stopApp
- openLink: '${DEV_CLIENT_URL}'
- extendedWaitUntil:
    visible:
      id: app-ready
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: app-brand-screen
    timeout: 30000
- runFlow:
    when:
      visible:
        id: onboarding-skip
    commands:
      - tapOn:
          id: onboarding-skip
      - extendedWaitUntil:
          notVisible:
            id: onboarding-skip
          timeout: 10000
