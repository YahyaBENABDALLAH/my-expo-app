appId: com.hyrkul.likan
---
- runFlow: bootstrap-app.yaml
- runFlow:
    when:
      visible:
        id: auth-development-guest
    commands:
      - tapOn:
          id: auth-development-guest
- openLink: '${STORYBOOK_URL}?mode=canvas'
- extendedWaitUntil:
    visible:
      id: expo-ui-button
    timeout: 120000
- openLink: '${STORYBOOK_URL}?STORYBOOK_STORY_ID=${STORY_ID}&mode=canvas'
- extendedWaitUntil:
    visible:
      id: '${READY_ID}'
    timeout: 60000
